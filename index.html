<!DOCTYPE html>
<html>
<head>
<title>National GF Day ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
margin:0;height:100vh;overflow:hidden;
font-family:Arial,sans-serif;
background:#c98b8b;
display:flex;justify-content:center;align-items:center
}

.card{
background:#fff5f5;
width:90%;max-width:450px;
padding:30px;border-radius:25px;
text-align:center;
box-shadow:0 15px 35px #7b1e1e55;
z-index:5
}

.card img{
width:250px;height:250px;
object-fit:cover;border-radius:20px
}

h1{color:#7b1e1e}
p{color:#5a3030;line-height:1.5}

button{
padding:12px 28px;
margin:10px;
border:0;
border-radius:25px;
font-size:18px;
cursor:pointer
}

#yes{background:#8f3f3f;color:white}
#no{background:#999;color:white}

#floatBox{
position:fixed;
width:100%;height:100%;
top:0;left:0;
overflow:hidden;
pointer-events:none
}

.floating{
position:absolute;
border-radius:15px;
opacity:.8;
animation:up linear forwards
}

@keyframes up{
from{transform:translateY(110vh) rotate(0)}
to{transform:translateY(-150px) rotate(360deg)}
}
</style>

</head>

<body>

<div id="floatBox"></div>

<div class="card">

<img id="photo" src="happy.jpg">

<h1 id="text">
Do you wanna go with me unwinding and celebrating National GF Day? ❤️
</h1>

<button id="yes">YES ❤️</button>
<button id="no">NO 💔</button>

</div>


<script>


// FLOATING PICTURES LOOP

let floatPics=[
"pic1.png",
"pic2.png",
"pic3.png",
"pic4.png",
"pic5.png"
];

let fp=0;

function floatPic(){

let x=document.createElement("img");

x.src=floatPics[fp];
x.className="floating";

x.style.left=Math.random()*100+"%";
x.style.width=40+Math.random()*30+"px";
x.style.animationDuration=7+Math.random()*5+"s";

document.getElementById("floatBox").appendChild(x);

setTimeout(()=>x.remove(),12000);

}

setInterval(floatPic,700);

setInterval(()=>{

fp++;

if(fp>=floatPics.length)fp=0;

},8000);



// NO BUTTON PROMPTS


let prompts=[

["Are you sure? 🥺","sad1.jpg"],
["Laaaaah bat ka nag No 😭","sad2.jpg"],
["Beeeeh hindi ako titigil dito 😂","sad3.jpg"],
["I'll wait until you said yes. Balakajan ❤️","sad4.jpg"],
["Basta mag wa-wait akooo, hindi ako aalis dito 🥹","sad5.jpg"],
["Kahit tumagal pa yan ilang taon pa, I'll wait na mag yes ka. Balakajan ❤️","sad6.jpg"],
["Yes? yes? yes? 🥺","sad7.jpg"],
["Tita oh, si Alex hahahaha 😂","sad8.jpg"],
["Beh try mo lang mag yes 😌","sad9.jpg"],
["Hindi to titigil hahahaha 😂","sad10.jpg"]

];


let order=[];
let i=0;


function shuffle(){

order=[...prompts].sort(()=>Math.random()-.5);
i=0;

}

shuffle();



document.getElementById("no").onclick=()=>{


if(i>=order.length)shuffle();


document.getElementById("text").innerHTML=order[i][0];

document.getElementById("photo").src=order[i][1];


document.getElementById("yes").style.transform=
"scale("+(1+i*.12)+")";


i++;

};




// YES PAGE


document.getElementById("yes").onclick=()=>{


document.querySelector(".card").innerHTML=`

<img src="yes.jpg">

<h1>
YAY! Thank you for saying yes, Dear! ❤️
</h1>

<button onclick="itinerary()">Next ➜</button>

`;

};



function itinerary(){

document.querySelector(".card").innerHTML=`

<img src="itinerary.jpg">

<h1>
Because you said yes, here's our itinerary! 🥰
</h1>

<p>
If you have any suggestions, feel free to message me.
We can still adjust this depending on what time we meet and the weather. Hehehe ❤️
</p>

<button onclick="finalPage()">Next ➜</button>

`;

}



function finalPage(){

document.querySelector(".card").innerHTML=`

<h1>
See you, Dear! ❤️
</h1>

<p>
Get a good night's sleep today, okay?
Let's enjoy our day tomorrow.
I can't wait to spend the day with you. 🥰
</p>

`;

}


</script>

</body>
</html>
