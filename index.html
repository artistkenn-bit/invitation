<!DOCTYPE html>
<html>
<head>
<title>National GF Day ❤️</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:Arial;
background:#c98b8b;
display:flex;
align-items:center;
justify-content:center
}

.card{
background:#fff5f5;
padding:25px;
width:90%;
max-width:420px;
text-align:center;
border-radius:25px;
box-shadow:0 10px 30px #7b1e1e55;
z-index:2
}

img{
width:230px;
height:230px;
object-fit:cover;
border-radius:20px
}

h1{
color:#7b1e1e
}

p{
color:#5a3030;
line-height:1.5
}

button{
padding:12px 25px;
margin:8px;
border:0;
border-radius:20px;
font-size:18px;
cursor:pointer
}

#yes{
background:#8f3f3f;
color:white
}

#no{
background:#999;
color:white
}


#floatBox{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none
}

.float{
position:absolute;
animation:fly linear forwards;
border-radius:15px
}

@keyframes fly{

from{
transform:translateY(110vh)
}

to{
transform:translateY(-120px) rotate(360deg)
}

}

</style>

</head>


<body>


<div id="floatBox"></div>


<div class="card">

<img id="photo" src="happy.jpg">

<h1 id="text">
Do you wanna go with me unwinding and celebrating National GF Day? ❤️
</h1>


<button id="yes">
YES ❤️
</button>

<button id="no">
NO 💔
</button>


</div>



<script>


// FLOATING PICTURES LOOP

let pics=[
"pic1.png",
"pic2.png",
"pic3.png",
"pic4.png",
"pic5.png"
];


let p=0;


setInterval(()=>{

let x=document.createElement("img");

x.src=pics[p];

x.className="float";


x.style.left=Math.random()*100+"%";

x.style.width=
40+Math.random()*30+"px";


x.style.animationDuration=
7+Math.random()*5+"s";


document.getElementById("floatBox")
.appendChild(x);


setTimeout(()=>x.remove(),12000);


},700);



setInterval(()=>{

p++;

if(p>=pics.length)
p=0;


},8000);





// NO PROMPTS


let prompts=[

["Are you sure? 🥺","sad1.jpg"],

["Laaaaah bat ka nag No 😭","sad2.jpg"],

["Beeeeh hindi ako titigil dito 😂","sad3.jpg"],

["I'll wait until you said yes. Balakajan ❤️","sad4.jpg"],

["Basta mag wa-wait akooo, hindi ako aalis dito 🥹","sad5.jpg"],

["Kahit tumagal pa yan ilang taon pa, I'll wait na mag yes ka. Balakajan ❤️","sad6.jpg"],

["Yes? yes? yes? 🥺","sad7.jpg"],

["Tita oh, si Alex hahahaha 😂","sad8.jpg"],

["Beh try mo lang mag yes 😌","sad9.jpg"],

["Hindi to titigil hahahaha 😂","sad10.jpg"]

];


let list=[];
let i=0;
let scale=1;


function shuffle(){

list=[...prompts].sort(()=>Math.random()-.5);

i=0;

}

shuffle();



no.onclick=()=>{


if(i>=list.length)
shuffle();


text.innerHTML=list[i][0];

photo.src=list[i][1];


scale+=.15;

if(scale>3)
scale=3;


yes.style.transform=
`scale(${scale})`;


i++;

};





// YES PAGE


yes.onclick=()=>{


document.querySelector(".card").innerHTML=`

<img src="yes.jpg">


<h1>
YAY! Thank you for saying yes, Dear! ❤️
</h1>


<button onclick="itinerary()">
Next ➜
</button>

`;

};





function itinerary(){


document.querySelector(".card").innerHTML=`

<img src="itinerary.jpg"
style="
width:100%;
height:auto;
max-height:500px;
object-fit:contain;
">


<h1>
Because you said yes, here's our itinerary! 🥰
</h1>


<p>
If you have any suggestions, feel free to message me.
We can still adjust this depending on what time we meet and the weather. Hehehe ❤️
</p>


<button onclick="ending()">
Next ➜
</button>

`;

}





function ending(){


document.querySelector(".card").innerHTML=`

<h1>
See you, Dear! ❤️
</h1>


<p>
Get a good night's sleep today, okay?
Let's enjoy our day tomorrow.
I can't wait to spend the day with you. 🥰
</p>

`;

}


</script>

</body>
</html>
