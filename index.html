<!DOCTYPE html>
<html>
<head>

<title>National GF Day ❤️</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:Arial;
background:#c98b8b;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:#fff5f5;
padding:25px;
width:90%;
max-width:420px;
text-align:center;
border-radius:25px;
box-shadow:0 10px 30px #7b1e1e55;
z-index:2;
}

.card img{
width:230px;
height:230px;
object-fit:cover;
border-radius:20px;
}

h1{
color:#7b1e1e;
}

p{
color:#5a3030;
line-height:1.5;
}

button{
padding:12px 25px;
margin:8px;
border:0;
border-radius:20px;
font-size:18px;
cursor:pointer;
}

#yes{
background:#8f3f3f;
color:white;
}

#no{
background:#999;
color:white;
}

#floatBox{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
}


.float{
position:absolute;
object-fit:contain;
border-radius:12px;
animation:fly linear forwards;
}


@keyframes fly{

from{
transform:translateY(110vh);
}

to{
transform:translateY(-120px) rotate(360deg);
}

}


#fullImage{

display:none;
position:fixed;
z-index:10;
top:0;
left:0;
width:100%;
height:100%;
background:#000c;
justify-content:center;
align-items:center;
flex-direction:column;

}


#fullImage img{

max-width:95%;
max-height:85%;
object-fit:contain;

}

</style>

</head>


<body>


<audio id="bgMusic" autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>



<div id="floatBox"></div>


<div id="fullImage">

<img id="bigPic">

<button onclick="closeFull()">
Close ❌
</button>

</div>



<div class="card">


<img id="photo" src="happy.jpg">


<h1 id="text">
Do you wanna go with me unwinding and celebrating National GF Day? ❤️
</h1>


<button id="yes">
YES ❤️
</button>


<button id="no">
NO 💔
</button>


</div>



<script>


// MUSIC

window.onload=function(){

let music=document.getElementById("bgMusic");

music.volume=0.5;

music.play();

};





// FLOATING PICTURES


let pics=[
"pic1.png",
"pic2.png",
"pic3.png",
"pic4.png",
"pic5.png"
];


let p=0;


setInterval(()=>{


let x=document.createElement("img");


x.src=pics[p];

x.className="float";


x.style.left=Math.random()*95+"%";

x.style.width=
35+Math.random()*25+"px";

x.style.height=
35+Math.random()*25+"px";


x.style.animationDuration=
8+Math.random()*5+"s";


document
.getElementById("floatBox")
.appendChild(x);



setTimeout(()=>x.remove(),13000);


},700);



setInterval(()=>{


p++;

if(p>=pics.length)
p=0;


},8000);





// NO PROMPTS


let prompts=[

["Are you sure? 🥺","sad1.jpg"],

["Laaaaah bat ka nag No 😭","sad2.jpg"],

["Beeeeh hindi ako titigil dito 😂","sad3.jpg"],

["I'll wait until you said yes. Balakajan ❤️","sad4.jpg"],

["Basta mag wa-wait akooo, hindi ako aalis dito 🥹","sad5.jpg"],

["Kahit tumagal pa yan ilang taon pa, I'll wait na mag yes ka. Balakajan ❤️","sad6.jpg"],

["Yes? yes? yes? 🥺","sad7.jpg"],

["Tita oh, si Alex hahahaha 😂","sad8.jpg"],

["Beh try mo lang mag yes 😌","sad9.jpg"],

["Hindi to titigil hahahaha 😂","sad10.jpg"]

];


let list=[];
let i=0;
let scale=1;


function shuffle(){

list=[...prompts].sort(()=>Math.random()-.5);

i=0;

}


shuffle();



no.onclick=function(){


if(i>=list.length)
shuffle();



text.innerHTML=list[i][0];


photo.src=list[i][1];



scale+=0.15;


if(scale>3)
scale=3;


yes.style.transform=
`scale(${scale})`;



i++;


};





// YES PAGE


yes.onclick=function(){


document.querySelector(".card").innerHTML=`

<img src="yes.jpg">


<h1>
YAY! Thank you for saying yes, Dear! ❤️
</h1>


<button onclick="itinerary()">
Next ➜
</button>

`;

};





function itinerary(){


document.querySelector(".card").innerHTML=`

<img src="itinerary.jpg"
style="width:100%;height:250px;object-fit:contain">


<h1>
Because you said yes, here's our itinerary! 🥰
</h1>


<button onclick="openFull()">
View Full Screen 📖
</button>


<p>
If you have any suggestions, feel free to message me.
We can still adjust this depending on what time we meet and the weather. Hehehe ❤️
</p>


<button onclick="ending()">
Next ➜
</button>

`;

}




function openFull(){

bigPic.src="itinerary.jpg";

fullImage.style.display="flex";

}



function closeFull(){

fullImage.style.display="none";

}





function ending(){


document.querySelector(".card").innerHTML=`

<h1>
See you, Dear! ❤️
</h1>


<p>
Get a good night's sleep today, okay?
Let's enjoy our day tomorrow.
I can't wait to spend the day with you. 🥰
</p>

`;

}


</script>


</body>
</html>
